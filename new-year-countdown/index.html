<!DOCTYPE html>
<html lang="en">
<head>
    <title>New Year Countdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Countdown to new year</h2>
    <div class="year">2026</div>
    <div class="countdown">
        <div id="day">00</div>
        <div id="hour">00</div>
        <div id="minute">00</div>
        <div id="second">00</div>
    </div>
    <script src="app.js"></script>
</body>
</html>
