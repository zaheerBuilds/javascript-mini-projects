<!DOCTYPE html>
<html lang="en">
<head>
    <title>Real Time Character Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Real Time Character Counter</h2>

        <textarea name="" id="textarea" class="textarea" placeholder="write your text here" maxlength="50"></textarea>
        <div class="counter-container">
            <p>Total Character
                <span class="total-counter" id="total-counter">0</span>
            </p>
            <p>Remaining Character
                <span class="remaining-counter" id="remaining-counter">50</span>
            </p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
